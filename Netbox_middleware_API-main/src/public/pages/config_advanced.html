    <main>
      <section class="container">
        <div id="size-container">
        <div class="config-container" id="center-container">
         
          <h2 class="subtitle">Configurações do PostgreSQL</h2>

          <label for="dbHostInput">Endereço do servidor</label>
          <input type="text" id="dbHostInput" placeholder="localhost" />

          <label for="dbNameInput">Banco de dados</label>
          <input type="text" id="dbNameInput" placeholder="netbox_history" />

          <label for="dbUserInput">Usuário</label>
          <input type="text" id="dbUserInput" placeholder="postgres" />

          <label for="dbPortInput">Porta</label>
          <input type="number" id="dbPortInput" placeholder="5432" />

          <label for="dbPasswordInput">Senha</label>
          <input type="password" id="dbPasswordInput"placeholder="Preencha apenas para alterar" />

          <label for="dbImportTableInput">Tabela de importação de acessos</label>
          <input type="text" id="dbImportTableInput" placeholder="access_history" />

          <label for="dbEventTableInput">Tabela de importação de eventos</label>
          <input type="text" id="dbEventTableInput" placeholder="event_history" />

          <button class="btntest" onclick="saveAndTestConfig()"> Testar conexão </button>
        </div>
        </div>
      </section>
    </main>
     <div id="status" class="info">Nenhum status disponivel.</div><br />
      <button id="saveConfigBtn" class="btn_function" onclick="saveConfig()">
